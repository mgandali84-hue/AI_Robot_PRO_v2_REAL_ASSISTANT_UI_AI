buildscript {
    ext.kotlin_version = '1.9.22' // Ensure a modern version of Kotlin (e.g., 1.9.x)
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1' // Or your AGP version
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.your_app_name" // Ensure your app's namespace is present
    compileSdk 34 // Or your current SDK version

    // 1. Fix NDK Version
    ndkVersion "28.2.13676358"

    defaultConfig {
        // ... your defaultConfig settings
    }

    // 2. Fix Java & Kotlin Target Compatibility Mismatch
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}


flutter {
    source = "../.."
}
